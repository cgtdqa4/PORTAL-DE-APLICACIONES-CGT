<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Aplicaciones - CGT DQA4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Chart.js para los gráficos de la calculadora de poder adquisitivo -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  /* PALETA OFICIAL CGT (Rojo y Negro) */
  --cgt-red: #cc0000;
  --cgt-red-hover: #e60000;
  --cgt-black: #121212;
  --cgt-dark-grey: #1e1e1e;
  --cgt-card-bg: #262626;
  --cgt-border: #3d3d3d;
  --text-main: #f5f5f5;
  --text-muted: #a3a3a3;
  --error-color: #ff6b6b;
  --radius: 12px;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
  background-color: var(--cgt-black);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 20px;
}

#app-portal {
  width: 100%;
  max-width: 1000px;
  margin: 20px auto;
}

header.portal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--cgt-red);
  margin-bottom: 35px;
  flex-wrap: wrap;
  gap: 15px;
}

.header-title h1 {
  font-size: 2rem;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-title h1 span {
  color: var(--cgt-red);
}

.header-title p {
  color: var(--text-muted);
  font-size: 0.95rem;
}

.section-block {
  margin-bottom: 45px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 20px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--cgt-border);
  color: #ffffff;
}

.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.app-card {
  background-color: var(--cgt-card-bg);
  border: 1px solid var(--cgt-border);
  border-radius: var(--radius);
  padding: 22px;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.app-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background-color: var(--cgt-red);
  opacity: 0;
  transition: opacity 0.2s;
}

.app-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
  border-color: #555;
}

.app-card:hover::before {
  opacity: 1;
}

.app-card h3 {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #fff;
}

.app-card p {
  color: var(--text-muted);
  font-size: 0.88rem;
  line-height: 1.45;
}

/* ESTILOS DE LA APLICACIÓN DE PODER ADQUISITIVO CGT */
.calc-container {
  background-color: var(--cgt-dark-grey);
  border: 1px solid var(--cgt-border);
  border-left: 4px solid var(--cgt-red);
  border-radius: var(--radius);
  padding: 25px;
  margin-top: 25px;
  box-shadow: var(--shadow);
}

.calc-header {
  border-bottom: 1px solid var(--cgt-border);
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.calc-header h2 {
  font-size: 1.6rem;
  color: #fff;
  font-weight: 800;
}

.calc-header p {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-top: 4px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
}

.form-group select, .form-group input {
  padding: 10px 14px;
  background-color: var(--cgt-black);
  border: 1px solid var(--cgt-border);
  border-radius: 8px;
  color: #fff;
  font-size: 0.9rem;
  outline: none;
}

.form-group select:focus, .form-group input:focus {
  border-color: var(--cgt-red);
}

.slider-box {
  background-color: var(--cgt-black);
  padding: 15px;
  border-radius: 8px;
  border: 1px solid var(--cgt-border);
  margin-bottom: 20px;
}

.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.85rem;
  font-weight: 700;
}

.slider-badge {
  background-color: var(--cgt-red);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.8rem;
}

.cgt-slider {
  width: 100%;
  accent-color: var(--cgt-red);
  cursor: pointer;
}

.btn-cgt {
  width: 100%;
  padding: 14px;
  background-color: var(--cgt-red);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: background-color 0.2s;
}

.btn-cgt:hover {
  background-color: var(--cgt-red-hover);
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-top: 25px;
}

.res-card {
  background-color: var(--cgt-black);
  border: 1px solid var(--cgt-border);
  border-radius: 8px;
  padding: 15px;
}

.res-card span {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 700;
}

.res-card div {
  font-size: 1.6rem;
  font-weight: 800;
  margin-top: 5px;
}

.alert-box {
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
  font-size: 0.9rem;
  line-height: 1.5;
}

.alert-deficit {
  background-color: rgba(204, 0, 0, 0.15);
  border: 1px solid var(--cgt-red);
  color: #ff8080;
}

.alert-surplus {
  background-color: rgba(0, 204, 102, 0.15);
  border: 1px solid #00cc66;
  color: #80ffc3;
}

.expenses-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 15px;
}

.expense-card {
  background-color: var(--cgt-black);
  border: 1px solid var(--cgt-border);
  padding: 12px;
  border-radius: 8px;
  font-size: 0.85rem;
}

.chart-wrapper {
  background-color: var(--cgt-black);
  border: 1px solid var(--cgt-border);
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
  height: 260px;
}

/* CAJA DE ACCESO A AFILIADOS */
.affiliates-auth-box {
  background-color: var(--cgt-dark-grey);
  border: 1px solid var(--cgt-border);
  border-left: 4px solid var(--cgt-red);
  padding: 30px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-width: 500px;
  margin: 10px 0;
}

.affiliates-auth-box h3 {
  font-size: 1.2rem;
  color: #fff;
  margin-bottom: 8px;
}

.affiliates-auth-box p {
  color: var(--text-muted);
  font-size: 0.88rem;
  margin-bottom: 20px;
}

.input-group-inline {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.input-group-inline input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  background-color: var(--cgt-black);
  border: 1px solid var(--cgt-border);
  border-radius: 8px;
  color: #fff;
  font-size: 0.95rem;
  outline: none;
}

.input-group-inline input:focus {
  border-color: var(--cgt-red);
}

.btn-inline {
  padding: 12px 20px;
  background-color: var(--cgt-red);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-inline:hover {
  background-color: var(--cgt-red-hover);
}

.error-msg {
  color: var(--error-color);
  font-size: 0.85rem;
  margin-top: 10px;
  display: none;
  font-weight: 500;
}

.logout-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: rgba(204, 0, 0, 0.1);
  border: 1px solid rgba(204, 0, 0, 0.3);
  padding: 12px 18px;
  border-radius: 8px;
  margin-bottom: 25px;
}

.logout-bar span {
  font-size: 0.9rem;
  color: #fff;
  font-weight: 600;
}

.btn-logout {
  background-color: transparent;
  border: 1px solid var(--cgt-border);
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: all 0.2s;
}

.btn-logout:hover {
